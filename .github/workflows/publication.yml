# Publier une version : poser une étiquette « v0.2.0 » sur main, ou
# lancer ce flux à la main depuis l'onglet Actions — il crée alors
# l'étiquette lui-même, d'après versionName.
# L'APK est signé avec la clé du projet, reçue par les secrets du dépôt,
# et sa somme SHA-256 est écrite dans les notes de la publication — le
# serveur du foyer la lit, et l'app la vérifie avant d'installer.
name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    name: APK signé et publication
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: L'étiquette correspond à la version de l'app
        id: version
        run: |
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à versionName ($version)."
            exit 1
          fi
          echo "etiquette=v$version" >> "$GITHUB_OUTPUT"

      - name: Clé de signature
        env:
          MH_KEYSTORE_BASE64: ${{ secrets.MH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MH_KEYSTORE_BASE64" ]; then
            echo "Le secret MH_KEYSTORE_BASE64 manque : voir docs/updates.md."
            exit 1
          fi
          echo "$MH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myhousehold.jks"

      - name: Tests du domaine
        run: ./gradlew :core:test

      - name: APK signé
        env:
          MH_KEYSTORE_FILE: ${{ runner.temp }}/myhousehold.jks
          MH_KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Nommer l'APK et calculer sa somme
        id: apk
        run: |
          nom="myhousehold-${{ steps.version.outputs.etiquette }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$nom"
          somme="$(sha256sum "$nom" | cut -d' ' -f1)"
          echo "nom=$nom" >> "$GITHUB_OUTPUT"
          {
            echo "MyHousehold ${{ steps.version.outputs.etiquette }}"
            echo
            echo "sha256: $somme"
          } > notes.md

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.etiquette }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.etiquette }}
          body_path: notes.md
          files: ${{ steps.apk.outputs.nom }}
          fail_on_unmatched_files: true
