<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bienvenue</title><link rel="stylesheet" href="app.css"></head>
<body>
  <div class="corps" style="gap:18px;padding-top:36px">
    <h1 style="font-size:28px">Bienvenue</h1>

    <div class="section">
      <h2>Rejoindre le foyer</h2>
      <div class="carte" style="border-color:var(--accent-trait)">
        <div class="ligne" style="color:var(--accent)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19h.01"/></svg><span style="font-size:13px;font-weight:600">Serveur trouvé sur ce Wi-Fi</span></div>
        <div class="ligne" style="margin-top:12px">
          <div style="flex:1;min-width:0">
            <h3>Maison des Dupont</h3>
            <p class="muet">192.168.1.20</p>
          </div>
          <span class="bouton primaire" style="min-height:40px;padding:0 16px;font-size:14px">Se connecter</span>
        </div>
      </div>
      <div class="bouton" style="gap:10px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/></svg>Scanner le QR code du serveur</div>
      <div class="bouton" style="gap:10px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>Saisir l'adresse du serveur</div>
    </div>

    <div class="ligne" style="color:var(--gris);font-size:13px"><span style="flex:1;height:1px;background:var(--trait)"></span>ou<span style="flex:1;height:1px;background:var(--trait)"></span></div>

    <div class="section">
      <h2>Sans serveur</h2>
      <div class="bouton primaire">Commencer sans serveur</div>
      <p class="muet">Tout reste sur ce téléphone. Le serveur, installé plus tard, reprendra ce qui aura été fait.</p>
    </div>
  </div>
</body></html>
