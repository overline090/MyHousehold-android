<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Agenda</title><link rel="stylesheet" href="app.css">
<style>
  .mois { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .mois .jour { aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:13px; gap:3px; }
  .mois .jour.autre { color:#b7c3bf; }
  .mois .jour.aujourdhui { background:var(--accent); color:#fff; font-weight:700; }
  .points { display:flex; gap:2px; }
  .points i { width:4px; height:4px; border-radius:50%; display:block; }
  .entete-jours { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; font-size:11px;
    color:var(--gris); text-align:center; margin-bottom:4px; }
</style></head>
<body style="position:relative">
  <header class="entete">
    <div class="ligne">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <div style="flex:1"><h1>Octobre 2026</h1></div>
      <span style="color:var(--gris)">‹ ›</span>
    </div>
  </header>

  <div class="corps" style="gap:14px">
    <div>
      <div class="entete-jours"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="mois">
        <div class="jour autre">28</div><div class="jour autre">29</div><div class="jour autre">30</div>
        <div class="jour">1</div><div class="jour">2</div><div class="jour">3</div><div class="jour">4</div>
        <div class="jour">5<div class="points"><i style="background:#0F766E"></i></div></div>
        <div class="jour">6</div><div class="jour">7</div><div class="jour">8</div>
        <div class="jour">9<div class="points"><i style="background:#B45309"></i></div></div>
        <div class="jour">10</div><div class="jour">11</div>
        <div class="jour">12<div class="points"><i style="background:#0F766E"></i></div></div>
        <div class="jour">13</div><div class="jour">14</div><div class="jour">15</div><div class="jour">16</div>
        <div class="jour">17</div><div class="jour">18</div>
        <div class="jour">19<div class="points"><i style="background:#0F766E"></i></div></div>
        <div class="jour">20</div><div class="jour">21</div><div class="jour">22</div><div class="jour">23</div>
        <div class="jour">24</div>
        <div class="jour aujourdhui">25<div class="points"><i style="background:#fff"></i><i style="background:#fff"></i></div></div>
        <div class="jour">26<div class="points"><i style="background:#7C3AED"></i></div></div>
        <div class="jour">27<div class="points"><i style="background:#0F766E"></i></div></div>
        <div class="jour">28</div><div class="jour">29</div><div class="jour">30</div><div class="jour">31</div>
      </div>
    </div>

    <div class="section">
      <h2>Samedi 25 octobre</h2>
      <div class="carte">
        <div class="ligne">
          <div style="flex:none;width:44px;text-align:center"><p style="font-weight:700">15:30</p></div>
          <div style="flex:1;border-left:3px solid var(--accent);padding-left:10px">
            <h3>Dentiste — Lou</h3>
            <p class="muet">Cabinet Martin</p>
          </div>
        </div>
      </div>
      <div class="carte">
        <div class="ligne">
          <div style="flex:none;width:44px;text-align:center"><p style="font-weight:700">19:00</p></div>
          <div style="flex:1;border-left:3px solid var(--gris);padding-left:10px">
            <h3>Sortir les poubelles</h3>
            <p class="muet">Tâche — Marie</p>
          </div>
        </div>
      </div>
      <div class="carte" style="background:var(--surface-douce)">
        <div class="ligne">
          <div style="flex:none;width:44px;text-align:center"><p style="font-weight:700">20:00</p></div>
          <div style="flex:1;border-left:3px solid #7C3AED;padding-left:10px">
            <h3>Occupé</h3>
            <p class="muet">Agenda de Paul — lecture seule</p>
          </div>
        </div>
      </div>
    </div>
  </div>

<!-- Bouton d'ajout : toujours au même endroit, au-dessus de la barre. -->
<div style="position:absolute;right:20px;bottom:84px;width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(15,118,110,.35)"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
<nav class="nav">
  <div class="N1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>Accueil</div>
  <div class="N2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>Tâches</div>
  <div class="N3 actif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Agenda</div>
</nav>

</body></html>
