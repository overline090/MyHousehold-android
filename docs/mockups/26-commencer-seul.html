<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Votre foyer</title><link rel="stylesheet" href="app.css"></head>
<body>
  <header class="entete">
    <div class="ligne">
      <span style="font-size:20px;color:var(--gris)">←</span>
      <h1 style="font-size:20px">Votre foyer</h1>
    </div>
  </header>
  <div class="corps" style="gap:13px">
    <p class="muet" style="font-size:14px">Tout reste sur ce téléphone. Le serveur, installé plus tard, reprendra ce qui aura été fait.</p>
    <div class="champ"><label>Nom du foyer</label><div class="saisie">Maison des Dupont</div></div>
    <div class="pile" style="align-items:center;gap:6px;margin-top:4px">
      <span class="photo grande" style="width:72px;height:72px;background:var(--surface-douce);border:2px dashed var(--trait-net);color:var(--gris)"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <p style="font-size:13px;font-weight:600;color:var(--accent)">Ajouter une photo (facultatif)</p>
    </div>
    <div class="ligne" style="gap:10px;align-items:flex-start">
      <div class="champ" style="flex:1"><label>Prénom</label><div class="saisie">Marie</div></div>
      <div class="champ" style="flex:1"><label>Nom</label><div class="saisie">Dupont</div></div>
    </div>
    <div class="champ"><label>Date de naissance</label><div class="saisie" style="color:var(--gris)">Facultative</div></div>
    <div class="bouton primaire">Commencer</div>
  </div>
</body></html>
