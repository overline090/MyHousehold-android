<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Scanner pour retirer</title><link rel="stylesheet" href="app.css"></head>
<body style="background:#0b0f0e;color:#fff;position:relative">
  <header class="entete" style="background:transparent;border:none">
    <div class="ligne"><span style="font-size:20px">←</span><h1 style="font-size:20px;color:#fff">Scanner pour retirer</h1></div>
  </header>
  <!-- Code-barres ou QR : la caméra lit les deux. Un code connu ouvre « Retirer » pour son article (1, note) ; un code inconnu se lie à un article existant, ou crée un nouvel article qui le porte. -->
  <div class="corps" style="align-items:center;justify-content:center;gap:24px">
    <div style="width:290px;height:180px;border-radius:20px;border:3px solid #2dd4bf;box-shadow:0 0 0 2000px rgba(0,0,0,.45);position:relative"><div style="position:absolute;left:12px;right:12px;top:50%;height:2px;background:#f87171"></div></div>
    <p style="text-align:center;font-size:15px;max-width:290px;position:relative">Visez le code-barres ou le QR code de l'article.</p>
  </div>
  <div style="position:absolute;left:16px;right:16px;bottom:24px;background:#fff;color:var(--encre);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px">
    <p style="font-weight:600">Code 3 401 060 145 128 inconnu</p>
    <p class="muet" style="font-size:13px">Aucun article n'a ce code.</p>
    <div class="ligne" style="gap:10px"><div class="bouton" style="flex:1">Lier à un article</div><div class="bouton primaire" style="flex:1">Nouvel article</div></div>
    <p style="text-align:center;font-size:14px;font-weight:600;color:var(--accent)">Rescanner</p>
  </div>
</body></html>
