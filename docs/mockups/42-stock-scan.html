<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Stock — scanner</title><link rel="stylesheet" href="app.css"><style>
.vig{flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.vig.petite{width:26px;height:26px;border-radius:7px}
.vig.vide{background:var(--surface-douce);border:1px dashed var(--trait-net);color:var(--gris)}
.pas{width:32px;height:32px;border-radius:10px;border:1px solid var(--trait-net);display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--surface)}
.qte{min-width:24px;text-align:center;font-weight:700;font-size:16px}
.qte.bas{color:var(--alerte)}
.puces{display:flex;gap:8px;overflow:hidden}
.puces span{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 6px;border-radius:999px;border:1px solid var(--trait-net);background:var(--surface);font-size:14px}
.puces span.actif{border:2px solid var(--accent);background:var(--accent-doux);font-weight:600}
.fab-large{position:absolute;right:20px;bottom:24px;height:56px;padding:0 20px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;box-shadow:0 6px 16px rgba(15,118,110,.35)}
.barre-bas{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px 18px;background:var(--surface);border-top:1px solid var(--trait)}
.titre-gr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--encre-douce);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.titre-gr i{width:9px;height:9px;border-radius:50%;display:inline-block}
.retirer{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--trait-net);display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--surface)}
.rond{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
</style></head>
<!-- Avec « Retirer en scannant » activé dans les Réglages, un bouton Scanner rejoint le + : on vise le code-barres ou le QR de l'article, et la feuille « Retirer » s'ouvre. Les articles se rangent par groupe dans un tableau. Chaque carte a son bouton « Retirer » (flèche vers le bas) : une sortie en un geste, avec une note. « Déclarer une sortie » reste pour plusieurs articles d'un coup. -->

nd:#D97706"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-45 12 12)"/><path d="M10.5 10.5h.01M13.5 13.5h.01M10.5 13.5h.01M13.5 10.5h.01"/></svg></span><div style="flex:1;min-width:0"><h3>Pansements assortis</h3></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div class="ligne" style="gap:6px"><span class="qte">12</span></div><span class="muet" style="font-size:11px">min 10</span></div><span class="retirer" title="Retirer"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></span></div></div><div class="carte" style="padding:12px"><div class="ligne"><span class="vig" style="background:#0369A1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4v4l2 3v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9l2-3z"/><path d="M8 13h8"/></svg></span><div style="flex:1;min-width:0"><h3>Désinfectant</h3></div><div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div class="ligne" style="gap:6px"><span class="qte bas">0</span></div><span class="muet" style="font-size:11px">min 1</span></div><span class="retirer" title="Retirer"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></span></div></div></div><div class="fab-large"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v4"/><path d="M3 7v10l9 4 4-1.8M3 7l9 4 9-4M12 11v10"/><path d="M16 17h6M19 14l3 3-3 3"/></svg>Déclarer une sortie</div></body></html>
