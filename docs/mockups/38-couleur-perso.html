<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Couleur personnalisée</title><link rel="stylesheet" href="app.css">
<style>
  .pastilles { display:flex; gap:10px; flex-wrap:wrap; }
  .pastilles i { width:34px; height:34px; border-radius:50%; display:block; box-shadow:0 0 0 1px var(--trait-net); }
  .pastilles i.choisie { box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--encre); }
  .pastilles i.plus { background:conic-gradient(#ef4444,#f59e0b,#84cc16,#10b981,#06b6d4,#6366f1,#d946ef,#ef4444); position:relative; }
  .pastilles i.plus::after { content:"+"; position:absolute; inset:7px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:700; color:var(--encre); font-size:15px; }
  .piste { height:28px; border-radius:14px; position:relative; }
  .piste b { position:absolute; top:-3px; width:34px; height:34px; border-radius:50%; background:transparent; border:4px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); }
</style></head>
<body style="position:relative">
  <header class="entete"><div class="ligne"><span style="font-size:20px;color:var(--gris)">←</span><h1 style="font-size:20px">Mon profil</h1></div></header>
  <div class="corps">
    <div class="section">
      <h2>Couleur</h2>
      <!-- Les couleurs proposées, puis les miennes, puis « + » qui ouvre le choix libre. -->
      <div class="pastilles">
        <i style="background:#0f766e"></i><i style="background:#b45309"></i><i style="background:#7c3aed"></i>
        <i style="background:#2563eb"></i><i style="background:#db2777"></i><i style="background:#475569"></i>
        <i class="choisie" style="background:#e11d48"></i><i class="plus"></i>
      </div>
    </div>
  </div>

<div style="position:absolute;inset:0;background:rgba(16,23,21,.45)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:16px">
  <div style="width:36px;height:4px;border-radius:2px;background:var(--trait-net);margin:0 auto 4px"></div>
  <div class="ligne">
    <h3 style="font-size:18px;flex:1">Couleur personnalisée</h3>
    <span style="width:44px;height:44px;border-radius:12px;background:#e11d48"></span>
  </div>
  <div class="champ"><label>Teinte</label>
    <div class="piste" style="background:linear-gradient(90deg,#ef4444,#f59e0b,#eab308,#84cc16,#10b981,#06b6d4,#3b82f6,#6366f1,#d946ef,#ef4444)"><b style="left:calc(96% - 17px)"></b></div></div>
  <div class="champ"><label>Intensité</label>
    <div class="piste" style="background:linear-gradient(90deg,#9ca3af,#e11d48)"><b style="left:calc(80% - 17px)"></b></div></div>
  <div class="champ"><label>Clarté</label>
    <div class="piste" style="background:linear-gradient(90deg,#000,#e11d48,#fff)"><b style="left:calc(45% - 17px)"></b></div></div>
  <div class="champ"><label>Code</label><div class="saisie">#E11D48</div></div>
  <!-- Trop clair pour du texte blanc dessus : on le dit, sans l'interdire. -->
  <p class="muet">Les initiales restent lisibles sur cette couleur.</p>
  <div class="ligne" style="gap:10px">
    <div class="bouton" style="flex:1">Annuler</div>
    <div class="bouton primaire" style="flex:1">Choisir</div>
  </div>
</div>
</body></html>
