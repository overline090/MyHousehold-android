<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Icône personnalisée</title><link rel="stylesheet" href="app.css"></head>
<body style="position:relative">
  <header class="entete"><div class="ligne"><span style="font-size:20px;color:var(--gris)">←</span><h1 style="font-size:20px">Stock</h1></div></header>
  <div class="corps"></div>

<div style="position:absolute;inset:0;background:rgba(16,23,21,.45)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:14px">
  <div style="width:36px;height:4px;border-radius:2px;background:var(--trait-net);margin:0 auto 4px"></div>
  <div class="ligne">
    <span style="width:52px;height:52px;border-radius:14px;background:#fde68a;display:flex;align-items:center;justify-content:center;font-size:28px">🍝</span>
    <h3 style="font-size:18px;flex:1">Modifier le tableau</h3>
  </div>
  <div class="champ"><label>Nom</label><div class="saisie">Pâtes et riz</div></div>
  <!-- « Perso » : un emoji, ou une à deux lettres, posé sur la couleur. -->
  <div class="champ"><label>Image</label>
    <div class="segment"><span>Aucune</span><span>Icône</span><span class="actif">Perso</span><span>Image</span></div></div>
  <div class="champ"><label>Emoji ou lettres</label><div class="saisie" style="font-size:20px">🍝</div></div>
  <p class="muet">Un emoji, ou une à deux lettres (« PR », « 3 »). Il s'affiche sur la couleur choisie.</p>
  <div class="champ"><label>Couleur</label>
    <div class="ligne" style="gap:10px">
      <i style="width:30px;height:30px;border-radius:50%;background:#0f766e"></i>
      <i style="width:30px;height:30px;border-radius:50%;background:#7c3aed"></i>
      <i style="width:30px;height:30px;border-radius:50%;background:#d97706"></i>
      <i style="width:30px;height:30px;border-radius:50%;background:#fde68a;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--encre)"></i>
      <i style="width:30px;height:30px;border-radius:50%;background:conic-gradient(#ef4444,#f59e0b,#84cc16,#10b981,#06b6d4,#6366f1,#d946ef,#ef4444)"></i>
    </div></div>
  <div class="ligne" style="gap:10px">
    <div class="bouton" style="flex:1">Annuler</div>
    <div class="bouton primaire" style="flex:1">Enregistrer</div>
  </div>
</div>
</body></html>
