<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Scanner</title><link rel="stylesheet" href="app.css"></head>
<body style="background:#0b0f0e;color:#fff">
  <header class="entete" style="background:transparent;border:none">
    <div class="ligne"><span style="font-size:20px">←</span><h1 style="font-size:20px;color:#fff">Scanner le QR code</h1></div>
  </header>
  <div class="corps" style="align-items:center;justify-content:center;gap:28px">
    <!-- Le cadre : ce qu'on vise. La vue caméra remplit le fond. -->
    <div style="width:250px;height:250px;border-radius:20px;border:3px solid #2dd4bf;box-shadow:0 0 0 2000px rgba(0,0,0,.45)"></div>
    <p style="text-align:center;font-size:15px;max-width:290px;position:relative">Visez le QR code affiché par la page web de votre serveur.</p>
    <span style="font-size:14px;font-weight:600;color:#2dd4bf;position:relative">Saisir l'adresse à la place</span>
  </div>
</body></html>
