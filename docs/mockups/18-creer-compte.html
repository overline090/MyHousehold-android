<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Créer mon compte</title><link rel="stylesheet" href="app.css"></head>
<body>
  <header class="entete">
    <div class="ligne">
      <span style="font-size:20px;color:var(--gris)">←</span>
      <h1 style="font-size:20px">Créer mon compte</h1>
    </div>
  </header>

  <div class="corps" style="gap:13px">
    <div class="champ">
      <label>Code d'invitation</label>
      <div class="saisie">K7MP-4RQX</div><p class="muet">Donné par un membre du foyer, depuis l'app ou la page web.</p>
    </div>
    <div class="ligne" style="gap:10px;align-items:flex-start">
      <div class="champ" style="flex:1"><label>Prénom</label><div class="saisie">Lou</div></div>
      <div class="champ" style="flex:1"><label>Nom</label><div class="saisie">Dupont</div></div>
    </div>
    <div class="champ">
      <label>Date de naissance</label>
      <div class="saisie" style="color:var(--gris)">Facultative</div>
    </div>
    <div class="champ">
      <label>Identifiant</label>
      <div class="saisie">lou</div><p class="muet">Pour vous connecter. Lettres, chiffres, point ou tiret.</p>
    </div>
    <div class="champ">
      <label>Mot de passe</label>
      <div class="saisie">••••••••••••</div><p class="muet">10 caractères au moins.</p>
    </div>

    <div class="bouton primaire">Créer mon compte</div>
  </div>
</body></html>
