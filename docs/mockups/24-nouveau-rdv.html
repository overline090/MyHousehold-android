<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nouveau rendez-vous</title><link rel="stylesheet" href="app.css"></head>
<body>
  <header class="entete">
    <div class="ligne">
      <span style="font-size:20px;color:var(--gris)">←</span>
      <h1 style="font-size:20px;flex:1">Nouveau rendez-vous</h1>
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </div>
  </header>
  <div class="corps" style="gap:13px">
    <div class="champ"><label>Titre</label><div class="saisie">Dentiste — Lou</div></div>
    <div class="ligne" style="justify-content:space-between;font-size:15px"><span>Journée entière</span>
      <span style="width:44px;height:26px;border-radius:13px;background:var(--trait-net);position:relative"><i style="position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff"></i></span></div>
    <div class="ligne" style="gap:10px">
      <div class="champ" style="flex:1.4"><label>Début</label><div class="saisie">Mar. 3 novembre</div></div>
      <div class="champ" style="flex:1"><label>&nbsp;</label><div class="saisie">15:30</div></div>
    </div>
    <div class="ligne" style="gap:10px">
      <div class="champ" style="flex:1.4"><label>Fin</label><div class="saisie">Mar. 3 novembre</div></div>
      <div class="champ" style="flex:1"><label>&nbsp;</label><div class="saisie">16:15</div></div>
    </div>
    <div class="champ"><label>Lieu</label><div class="saisie" style="color:var(--gris)">Facultatif</div></div>
    <div class="champ"><label>Qui est concerné</label>
      <div class="ligne" style="flex-wrap:wrap;gap:6px"><span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-doux);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600"><span class="photo" style="width:24px;height:24px;font-size:10px;background:#7C3AED">L</span>Lou</span><span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-doux);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600"><span class="photo" style="width:24px;height:24px;font-size:10px;background:#0f766e">M</span>Marie</span><span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--trait-net);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:400"><span class="photo" style="width:24px;height:24px;font-size:10px;background:#B45309">P</span>Paul</span></div>
    </div>
    <div class="champ"><label>Visible par</label>
      <div class="segment"><span class="actif">Tout le foyer</span><span>Moi seulement</span></div>
    </div>
    <div class="bouton primaire" style="margin-top:4px">Enregistrer</div>
  </div>
</body></html>
