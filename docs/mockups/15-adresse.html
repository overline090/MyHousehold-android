<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Adresse du serveur</title><link rel="stylesheet" href="app.css"></head>
<body>
  <header class="entete">
    <div class="ligne">
      <span style="font-size:20px;color:var(--gris)">←</span>
      <h1 style="font-size:20px">Adresse du serveur</h1>
    </div>
  </header>

  <div class="corps" style="gap:16px">
    <div class="champ">
      <label>Adresse</label>
      <div class="saisie" style="color:var(--gris)">192.168.1.20 ou maison.mondomaine.fr</div>
      <p class="muet">Celle affichée par la page web du serveur. Le port est facultatif.</p>
    </div>
    <div class="bouton primaire">Se connecter</div>
    <div class="encadre douce">À la maison, l'adresse locale suffit. Hors de chez vous, il faut l'adresse publique que vous avez donnée à votre serveur.</div>
  </div>
</body></html>
